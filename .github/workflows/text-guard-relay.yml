name: text-guard-relay

# Finishes text-guard for pull request events from forks. Those runs have no secrets and a
# read-only token, so they only upload the item's ids. This run, on the default branch, reads
# the ids (untrusted: the script accepts only a known kind and positive integers), fetches the
# text itself from the API and judges it like text-guard does. No code from the fork runs.
on:
  workflow_run:
    workflows: [text-guard]
    types: [completed]

permissions: {}

jobs:
  scan:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && contains(fromJSON('["pull_request", "pull_request_review", "pull_request_review_comment"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # download the ids artifact of the triggering run
      pull-requests: write # replace a body or review summary, delete a review comment
    steps:
      - name: Download the recorded ids
        id: ref
        uses: actions/download-artifact@v4
        continue-on-error: true # most text-guard runs record nothing
        with:
          name: text-guard-ref
          path: ${{ runner.temp }}/ref
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.ref.outcome == 'success'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            .safety-guard.json
            .bun-version
          sparse-checkout-cone-mode: false
      - if: steps.ref.outcome == 'success'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - if: steps.ref.outcome == 'success'
        name: Scan the text
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAFETY_GUARD_WORDS: ${{ secrets.SAFETY_GUARD_WORDS }}
        run: bun scripts/text-guard.ts --ref "$RUNNER_TEMP/ref/text-guard-ref.json" --apply
